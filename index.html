<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2740">

  <title>Deep Freeze</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Deep Freeze">
  <meta name="application-name" content="Deep Freeze">

  <link rel="apple-touch-icon" href="./Deep_Freeze_App_Icon_512.png">
  <link rel="icon" type="image/png" href="./Deep_Freeze_App_Icon_512.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f4f7fa;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      position: fixed;
      inset: 0;
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      background: #f4f7fa;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f7fa;
    }

    .fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: #f4f7fa;
      color: #17202a;
      z-index: -1;
    }

    .fallback a {
      color: #1769aa;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="fallback">
      <div>
        <strong>Opening Deep Freeze…</strong>
        <p>If the app does not appear, <a href="https://script.google.com/macros/s/AKfycbw6zI62hk4iB0mwxngytkFJ_YcE26vmVPesGfbsUjlVoWyrqkjHhKUm6ZKP3DRq3jrjeA/exec">open it directly</a>.</p>
      </div>
    </div>

    <iframe
      src="https://script.google.com/macros/s/AKfycbw6zI62hk4iB0mwxngytkFJ_YcE26vmVPesGfbsUjlVoWyrqkjHhKUm6ZKP3DRq3jrjeA/exec"
      title="Deep Freeze"
      allow="camera"
      referrerpolicy="no-referrer"
    ></iframe>
  </div>
</body>
</html>
