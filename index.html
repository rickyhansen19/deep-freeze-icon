<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2740">

  <title>Deep Freeze</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Deep Freeze">
  <meta name="application-name" content="Deep Freeze">

  <link rel="apple-touch-icon" href="./Deep_Freeze_App_Icon_512.png">
  <link rel="icon" type="image/png" href="./Deep_Freeze_App_Icon_512.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    :root {
      color-scheme: light;
      --bg: #eef6fb;
      --text: #13324b;
      --muted: #60788b;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }
    body {
      display: grid;
      place-items: center;
      padding:
        calc(24px + env(safe-area-inset-top))
        calc(24px + env(safe-area-inset-right))
        calc(24px + env(safe-area-inset-bottom))
        calc(24px + env(safe-area-inset-left));
    }
    .launch {
      text-align: center;
      max-width: 320px;
    }
    .icon {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow: 0 8px 28px rgba(15, 39, 64, .16);
    }
    h1 {
      margin: 18px 0 5px;
      font-size: 27px;
      letter-spacing: -.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 22px auto 0;
      border: 3px solid rgba(19,50,75,.15);
      border-top-color: #1674b8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a {
      display: inline-block;
      margin-top: 20px;
      color: #0d6097;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="launch">
    <img class="icon" src="./Deep_Freeze_App_Icon_512.png" alt="Deep Freeze">
    <h1>Deep Freeze</h1>
    <p>Opening your freezer inventory…</p>
    <div class="spinner" aria-hidden="true"></div>
    <noscript><a href="https://script.google.com/macros/s/AKfycbw6zI62hk4iB0mwxngytkFJ_YcE26vmVPesGfbsUjIVoWyrqkjHhKUm6ZKP3DRq3jrjeA/exec">Open Deep Freeze</a></noscript>
  </main>

  <script>
    const appUrl = "https://script.google.com/macros/s/AKfycbw6zI62hk4iB0mwxngytkFJ_YcE26vmVPesGfbsUjIVoWyrqkjHhKUm6ZKP3DRq3jrjeA/exec";
    // Small delay gives iOS time to paint the launch screen when opened
    // from the Home Screen, then transfers to the existing working app.
    setTimeout(() => {
      window.location.replace(appUrl);
    }, 250);
  </script>
</body>
</html>
